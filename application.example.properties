spring.application.name=attendance

spring.security.user.name =
spring.security.user.password=

jwt.secret=mysupersecretkey

spring.config.import=optional:file:.env.properties

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ── Cloudinary (free image hosting for signatures and fingerprints) ──────────
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# ── EmailJS (verification, password reset, and attendance reminder emails share this one generic template) ──
app.emailjs.service-id=${EMAILJS_SERVICE_ID:}
app.emailjs.template-id=${EMAILJS_TEMPLATE_ID:}
app.emailjs.public-key=${EMAILJS_PUBLIC_KEY:}
app.emailjs.private-key=${EMAILJS_PRIVATE_KEY:}

# ── Frontend URL (linked from reminder emails) ────────────────────────────────
app.frontend-url=${FRONTEND_URL:http://localhost:4200}

# Add matching values to your .env.properties:
#   CLOUDINARY_CLOUD_NAME=..., CLOUDINARY_API_KEY=..., CLOUDINARY_API_SECRET=...
#   EMAILJS_SERVICE_ID=..., EMAILJS_TEMPLATE_ID=...
#   EMAILJS_PUBLIC_KEY=..., EMAILJS_PRIVATE_KEY=...
#   FRONTEND_URL=http://localhost:4200

