spring.application.name=attendance

spring.security.user.name =stevens
spring.security.user.password=17032004

jwt.secret=mysupersecretkey

spring.config.import=optional:file:.env.properties

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ── Cloudinary (free image hosting for signatures and fingerprints) ──────────
# Sign up at https://cloudinary.com (free plan: 25 GB storage)
# Add these to your .env.properties file:
#   CLOUDINARY_CLOUD_NAME=your_cloud_name
#   CLOUDINARY_API_KEY=your_api_key
#   CLOUDINARY_API_SECRET=your_api_secret
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# ── Multipart (allow uploading signature/fingerprint/photo images) ───────────
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ── CORS (frontend origin) ────────────────────────────────────────────────────
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# ── EmailJS (verification, password reset, and attendance reminder emails share this one generic template) ────
app.emailjs.service-id=${EMAILJS_SERVICE_ID:}
app.emailjs.template-id=${EMAILJS_TEMPLATE_ID:}
app.emailjs.public-key=${EMAILJS_PUBLIC_KEY:}
app.emailjs.private-key=${EMAILJS_PRIVATE_KEY:}

# ── Frontend URL (used as the link inside reminder emails) ───────────────────
app.frontend-url=${FRONTEND_URL:http://localhost:4200}

